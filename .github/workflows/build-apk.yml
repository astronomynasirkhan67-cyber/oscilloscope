name: Build Digital Oscilloscope APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore Debug Keystore if available
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -f "debug.keystore" ]; then
            echo "Debug keystore is ready."
          else
            echo "Debug keystore not found in root; Gradle will use standard fallback."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          echo "Starting Gradle debug APK assembly..."
          ./gradlew assembleDebug --stacktrace --info

      - name: Locate and Rename APK
        run: |
          echo "Searching for generated debug APK..."
          FOUND_APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          fi
          
          if [ -z "$FOUND_APK" ]; then
            echo "::error::Could not find debug APK output!"
            exit 1
          fi
          
          echo "Found APK at: $FOUND_APK"
          mkdir -p build-artifacts
          cp "$FOUND_APK" "build-artifacts/Digital-Oscilloscope-debug.apk"
          echo "Copied and renamed to build-artifacts/Digital-Oscilloscope-debug.apk"
          ls -lh build-artifacts/Digital-Oscilloscope-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Oscilloscope-APK
          path: build-artifacts/Digital-Oscilloscope-debug.apk
          if-no-files-found: error
          retention-days: 30
