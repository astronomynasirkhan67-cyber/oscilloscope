name: Build Digital Oscilloscope APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug.keystore..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keypass android \
                -storepass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -la debug.keystore

      - name: Gradle assembleDebug
        run: |
          echo "Starting Gradle debug build..."
          ./gradlew assembleDebug --stacktrace --info

      - name: Find APK
        id: find_apk
        run: |
          echo "Searching for generated APK across build outputs..."
          APK_PATH=$(find . -path "*/build/outputs/apk/debug/*.apk" -not -name "*unaligned*" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -path "*/build/outputs/apk/*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::Could not find any generated APK file!"
            exit 1
          fi
          echo "Found generated APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          APK_SRC="${{ steps.find_apk.outputs.apk_path }}"
          echo "Source APK path: $APK_SRC"
          mkdir -p build-artifacts
          cp "$APK_SRC" build-artifacts/Digital-Oscilloscope-debug.apk
          echo "Renamed and copied to: build-artifacts/Digital-Oscilloscope-debug.apk"
          ls -lh build-artifacts/Digital-Oscilloscope-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Oscilloscope-APK
          path: build-artifacts/Digital-Oscilloscope-debug.apk
          if-no-files-found: error
          retention-days: 30

